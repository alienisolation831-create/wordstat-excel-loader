name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install and check runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Python dependency vulnerability scan
        if: always()
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install pip-audit==2.9.0
          .audit-venv/bin/pip-audit -r requirements.txt --strict
      - name: Static security analysis
        if: always()
        run: |
          python -m venv .bandit-venv
          .bandit-venv/bin/pip install bandit==1.9.4
          .bandit-venv/bin/bandit -r app.py -ll
