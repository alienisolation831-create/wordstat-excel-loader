<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wordstat Excel Loader</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head><body><main><header><div class="eyebrow">SEO / TOOLS</div><h1>Wordstat Excel Loader</h1><p>Массовая выгрузка динамики поисковых запросов.</p></header><section id="login"><h2>Вход</h2><form id="loginform"><label>Пароль<input id="password" type="password" required autocomplete="current-password" maxlength="256"></label><button>Войти</button></form></section><div id="workspace" hidden><div class="top"><strong id="mode"></strong><button id="logout" class="secondary">Выйти</button></div><section><h2>01 / Настройка выгрузки</h2><label>Файл Excel (.xlsx)<input id="file" type="file" accept=".xlsx"></label><button id="preview" class="secondary">Проверить файл</button><div class="grid"><label>Лист<select id="sheet"></select></label><label>Номер столбца<input id="col" type="number" min="1" max="50" value="1"></label><label>Начало<input id="start" type="date" value="2026-09-01"></label><label>Конец<input id="end" type="date" value="2026-09-30"></label><label>Детализация<select id="period"><option value="month">Месяцы</option><option value="week">Недели</option><option value="day">Дни</option></select></label><label>Устройство<select id="device"><option value="DEVICE_ALL">Все</option><option value="DEVICE_DESKTOP">Компьютеры</option><option value="DEVICE_PHONE">Телефоны</option><option value="DEVICE_TABLET">Планшеты</option></select></label></div><label>Регионы (ID через запятую; пусто — все)<input id="regions" placeholder="213"></label><label class="check"><input id="header" type="checkbox" checked> Первая строка — заголовок</label><label class="check"><input id="confirm" type="checkbox"> Подтверждаю запуск и возможные расходы на API</label><button id="startjob">Запустить</button></section><section><h2>02 / Задачи</h2><div id="jobs"></div></section></div><p id="message" role="status" aria-live="polite"></p></main></body></html>
